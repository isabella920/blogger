
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR碼生成器 - 將文字和網址轉換為QR碼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 使用可靠的QRCode庫 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/lib/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
            animation: fadeIn 1s ease;
        }
        
        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .app-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .input-section, .output-section {
            flex: 1;
            min-width: 300px;
            max-width: 500px;
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }
        
        .input-section:hover, .output-section:hover {
            transform: translateY(-5px);
        }
        
        .section-title {
            font-size: 1.5rem;
            color: #2575fc;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title i {
            font-size: 1.3rem;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            border-color: #2575fc;
            outline: none;
        }
        
        .input-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .type-option {
            flex: 1;
            padding: 12px;
            text-align: center;
            background-color: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .type-option.active {
            background-color: #2575fc;
            color: white;
            border-color: #2575fc;
        }
        
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .generate-btn:hover {
            background: linear-gradient(to right, #5a0db0, #1c6ae4);
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
        }
        
        .generate-btn:active {
            transform: translateY(2px);
        }
        
        .examples {
            margin-top: 20px;
        }
        
        .examples h3 {
            margin-bottom: 10px;
            color: #555;
            font-size: 1rem;
        }
        
        .example-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .example-item {
            padding: 8px 12px;
            background-color: #f0f5ff;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #d1e3ff;
        }
        
        .example-item:hover {
            background-color: #e1ecff;
            transform: translateY(-2px);
        }
        
        .qrcode-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            padding: 20px;
            border: 2px dashed #e0e0e0;
            border-radius: 15px;
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }
        
        .qrcode-container.has-qrcode {
            border-color: #2575fc;
        }
        
        #qrcode {
            display: none;
            max-width: 100%;
        }
        
        .placeholder {
            text-align: center;
            color: #999;
        }
        
        .placeholder i {
            font-size: 4rem;
            color: #ddd;
            margin-bottom: 15px;
        }
        
        .placeholder p {
            font-size: 1.1rem;
        }
        
        .output-actions {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .action-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .download-btn {
            background-color: #28a745;
            color: white;
        }
        
        .download-btn:hover {
            background-color: #218838;
        }
        
        .clear-btn {
            background-color: #f8f9fa;
            color: #555;
            border: 2px solid #e0e0e0;
        }
        
        .clear-btn:hover {
            background-color: #e9ecef;
        }
        
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9rem;
            width: 100%;
        }
        
        footer a {
            color: white;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
        }
        
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                align-items: center;
            }
            
            .input-section, .output-section {
                width: 100%;
            }
            
            header h1 {
                font-size: 2.2rem;
            }
            
            .output-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-qrcode"></i> QR碼生成器</h1>
            <p>輕鬆將文本、網址等內容轉換為QR碼，方便分享和存儲</p>
        </header>
        
        <main class="app-container">
            <section class="input-section fade-in-up">
                <h2 class="section-title"><i class="fas fa-edit"></i> 輸入內容</h2>
                
                <div class="input-type-selector">
                    <div class="type-option active" data-type="text">文本</div>
                    <div class="type-option" data-type="url">網址</div>
                </div>
                
                <div class="input-group">
                    <label for="inputText" id="inputLabel">請輸入要轉換的文本</label>
                    <textarea id="inputText" placeholder="例如：歡迎使用QR碼生成器！"></textarea>
                </div>
                
                <button id="generateBtn" class="generate-btn">
                    <i class="fas fa-bolt"></i> 生成QR碼
                </button>
                
                <div class="examples">
                    <h3>試試這些例子：</h3>
                    <div class="example-items">
                        <div class="example-item" data-text="歡迎訪問我的個人網站！">歡迎文本</div>
                        <div class="example-item" data-text="https://www.example.com">範例網址</div>
                        <div class="example-item" data-text="電話：13800138000">聯絡方式</div>
                        <div class="example-item" data-text="WIFI名稱：MyNetwork\n密碼：12345678">WiFi信息</div>
                    </div>
                </div>
            </section>
            
            <section class="output-section fade-in-up">
                <h2 class="section-title"><i class="fas fa-qrcode"></i> 生成的QR碼</h2>
                
                <div class="qrcode-container" id="qrcodeContainer">
                    <div class="placeholder">
                        <i class="fas fa-qrcode"></i>
                        <p>QR碼將在這里顯示</p>
                        <p>輸入內容並點擊"生成QR碼"按鈕</p>
                    </div>
                    <div id="qrcode"></div>
                </div>
                
                <div class="output-actions">
                    <button id="downloadBtn" class="action-btn download-btn" disabled>
                        <i class="fas fa-download"></i> 下載QR碼
                    </button>
                    <button id="clearBtn" class="action-btn clear-btn">
                        <i class="fas fa-trash-alt"></i> 清空
                    </button>
                </div>
                
                <div style="margin-top: 25px; padding: 15px; background-color: #f8f9fa; border-radius: 10px;">
                    <h3 style="color: #2575fc; margin-bottom: 10px;"><i class="fas fa-lightbulb"></i> 使用提示</h3>
                    <ul style="color: #666; padding-left: 20px;">
                        <li>生成的QR碼可以保存為PNG圖片</li>
                        <li>QR碼內容支持中文、英文、數字和符號</li>
                        <li>網址QR碼使用手機掃描可以直接打開鏈接</li>
                        <li>建議保持QR碼周圍有足夠的空白區域</li>
                    </ul>
                </div>
            </section>
        </main>
        
        <footer>
            <p>© 2023 QR生成器 | 使用純前端技術生成，無需上傳任何數據到服務器</p>
            <p>基於 <a href="https://github.com/davidshimjs/qrcodejs" target="_blank">QRCode.js</a> 構建</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 獲取DOM元素
            const inputText = document.getElementById('inputText');
            const inputLabel = document.getElementById('inputLabel');
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');
            const qrcodeContainer = document.getElementById('qrcodeContainer');
            const qrcodeElement = document.getElementById('qrcode');
            const typeOptions = document.querySelectorAll('.type-option');
            const exampleItems = document.querySelectorAll('.example-item');
            
            let currentType = 'text';
            let currentQRCodeSVG = null;
            
            // 切換輸入類型
            typeOptions.forEach(option => {
                option.addEventListener('click', function() {
                    // 移除所有選項的active類
                    typeOptions.forEach(opt => opt.classList.remove('active'));
                    // 為當前選項添加active類
                    this.classList.add('active');
                    // 更新當前類型
                    currentType = this.dataset.type;
                    
                    // 更新標簽和占位符
                    if (currentType === 'url') {
                        inputLabel.textContent = '請輸入要轉換的網址';
                        inputText.placeholder = '例如：https://www.example.com';
                    } else {
                        inputLabel.textContent = '請輸入要轉換的文本';
                        inputText.placeholder = '例如：歡迎使用QR生成器！';
                    }
                    
                    // 清空輸入
                    inputText.value = '';
                });
            });
            
            // 範例點擊事件
            exampleItems.forEach(item => {
                item.addEventListener('click', function() {
                    inputText.value = this.dataset.text;
                    
                    // 如果範例是網址，自動切換到網址類型
                    if (this.dataset.text.startsWith('http')) {
                        typeOptions.forEach(opt => opt.classList.remove('active'));
                        document.querySelector('.type-option[data-type="url"]').classList.add('active');
                        currentType = 'url';
                        inputLabel.textContent = '請輸入要轉換的網址';
                        inputText.placeholder = '例如：https://www.example.com';
                    }
                });
            });
            
            // 生成QR碼
            generateBtn.addEventListener('click', function() {
                const text = inputText.value.trim();
                
                if (!text) {
                    alert('請輸入要轉換的內容');
                    return;
                }
                
                // 驗證網址格式（如果是網址類型）
                if (currentType === 'url' && !isValidURL(text)) {
                    if (!confirm('您輸入的網址格式可能不正確，是否繼續生成QR碼？')) {
                        return;
                    }
                }
                
                // 準備要編碼的文本
                let qrText = text;
                if (currentType === 'url' && !text.startsWith('http')) {
                    qrText = 'https://' + text;
                }
                
                // 生成二維碼
                try {
                    // 清空之前的QR碼
                    qrcodeElement.innerHTML = '';
                    
                    // 使用qrcode-svg庫生成QR碼
                    const qrcode = new QRCode({
                        content: qrText,
                        padding: 4,
                        width: 256,
                        height: 256,
                        color: "#000000",
                        background: "#ffffff",
                        ecl: "H" // 糾錯級別：L(7%), M(15%), Q(25%), H(30%)
                    });
                    
                    // 獲取SVG字符串
                    const svgString = qrcode.svg();
                    
                    // 顯示SVG QR碼
                    qrcodeElement.innerHTML = svgString;
                    currentQRCodeSVG = svgString;
                    
                    // 顯示二維碼區域
                    qrcodeElement.style.display = 'block';
                    document.querySelector('.placeholder').style.display = 'none';
                    qrcodeContainer.classList.add('has-qrcode');
                    
                    // 啟用下載按鈕
                    downloadBtn.disabled = false;
                    
                    // 添加動畫效果
                    qrcodeContainer.style.animation = 'none';
                    setTimeout(() => {
                        qrcodeContainer.style.animation = 'fadeInUp 0.5s ease';
                    }, 10);
                    
                } catch (error) {
                    console.error('生成QR碼時出錯:', error);
                    alert('生成QR碼時出錯，請確保輸入內容有效');
                }
            });
            
            // 下載QR碼
            downloadBtn.addEventListener('click', function() {
                if (!qrcodeElement.innerHTML) {
                    alert('請先生成QR碼');
                    return;
                }
                
                // 建立下載連結
                const svgBlob = new Blob([currentQRCodeSVG], {type: 'image/svg+xml;charset=utf-8'});
                const svgUrl = URL.createObjectURL(svgBlob);
                
                // 創建臨時canvas將SVG轉換為PNG
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    // 建立PNG下載連結
                    const pngUrl = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = `qrcode_${new Date().getTime()}.png`;
                    link.href = pngUrl;
                    link.click();
                    
                    // 清理URL對象
                    URL.revokeObjectURL(svgUrl);
                };
                
                img.src = svgUrl;
            });
            
            // 清空所有內容
            clearBtn.addEventListener('click', function() {
                inputText.value = '';
                
                // 隱藏QR碼
                qrcodeElement.innerHTML = '';
                qrcodeElement.style.display = 'none';
                document.querySelector('.placeholder').style.display = 'block';
                qrcodeContainer.classList.remove('has-qrcode');
                currentQRCodeSVG = null;
                
                // 禁用下載按鈕
                downloadBtn.disabled = true;
                
                // 重置為文本類型
                typeOptions.forEach(opt => opt.classList.remove('active'));
                document.querySelector('.type-option[data-type="text"]').classList.add('active');
                currentType = 'text';
                inputLabel.textContent = '請輸入要轉換的文本';
                inputText.placeholder = '例如：歡迎使用二維碼生成器！';
            });
            
            // 驗證URL格式
            function isValidURL(string) {
                try {
                    new URL(string);
                    return true;
                } catch (_) {
                    return false;
                }
            }
            
            // 輸入框自動調整高度
            inputText.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
            
            // 初始生成一個示例QR碼
            setTimeout(() => {
                inputText.value = "歡迎使用QR碼生成器！\n輕松將文本和網址轉換為QR碼。";
                generateBtn.click();
            }, 500);
        });
    </script>
</body>
</html>
